<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>

        var mon = 8;
        var tues = 7;
        var wednes = 9;
        var thurs = 8;
        var fri = 7;

        var totalHrs = mon + tues + wednes + thurs + fri;
        console.log("Total Hours per Week :", totalHrs, "Hours");

        var totalAvg = totalHrs/5;
        console.log("Average Hours per Day :", totalAvg, "Hours");

        totalHrs += 2;
        console.log("Final Total Hours with Overtime", totalHrs);

    </script>

</body>

</html>
