<body>

    <script>

        var length = 25;
        var width = 12;

        var area = length * width;
        var perimeter = 2 * ( length + width );
        console.log("Area :", area, "And Perimeter :", perimeter);

        area*= 2;
        console.log("Doubled Area :", area);

        area/= 2;
        console.log("Divided Area :", area);

    </script>

</body>
