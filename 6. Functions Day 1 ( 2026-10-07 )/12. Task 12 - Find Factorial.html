<body>
    
    <script>

        function factorial(n) {
            if (n < 0) {
                console.log("Factorial for negative numbers is not defined");
            }
            else if (n === 0 || n === 1){
                console.log( 1 );
            }

            let result = 1;
            for (let i = 2; i <= n; i++) {
                result *= i;
            }
            return result;
        }
        let final = factorial(5);
        console.log( final );

    </script>

</body>
</html>
