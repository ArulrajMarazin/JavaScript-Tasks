<body>
    
    <script>

        function findLargest( num1, num2, num3 ){
            let largest = num1;

            if( num2 > largest ){
                largest = num2;
            }

            else if( num3 > largest ){
                largest = num3
            }

            return `Your largest number is ${largest}`;
        }
        let final = findLargest( 3, 10, 1 );
        console.log( final );

    </script>
    
</body>
