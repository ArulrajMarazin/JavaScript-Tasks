<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>

        function checkEvenOdd() {

            let i = 100;

            if (i % 2 == 0) {
                console.log(`${i} is an Even Number`);
            }

            else {
                console.log(`${i} is an Odd Number`);
            }
        }

        checkEvenOdd();

    </script>

</body>

</html>
