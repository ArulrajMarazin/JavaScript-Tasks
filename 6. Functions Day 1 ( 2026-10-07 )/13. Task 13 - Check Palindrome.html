<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        
        function checkPalindrome(word){
            let reversedWord = "";
            let i = word.length - 1;
            
            while( i >= 0 ){
                reversedWord += word[i];
                i--;
            }

            if( word === reversedWord ){
                return `${word} : Palindrome`;
            }

            else{
                return `${word} : Not - Palindrome`;
            }

        }
        let final = checkPalindrome("madam");
        console.log( final );

    </script>

</body>

</html>
