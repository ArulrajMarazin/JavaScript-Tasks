<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>

        var marks = 90;

        if ( marks >= 90 ){
            console.log( "A+" );
        }

        else if ( marks >= 80 ){
            console.log( "A" )
        }

        else if ( marks >= 70 ){
            console.log( "B" );
        }

        else if ( marks >= 60 ){
            console.log( "C" );
        }

        else if ( marks >= 50 ){
            console.log( "D" );
        }

        else {
            console.log( "Fail" );
        }

    </script>

</body>
</html>
