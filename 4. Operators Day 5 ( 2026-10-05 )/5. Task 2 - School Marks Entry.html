    <script>

        let studentMarks = [ 92, 98, 63, 25, 76, 36, 85, 90, 65, 85, ];

        let i = 0;
        let total = 0;

        while( i < studentMarks.length ){

            total = total + studentMarks[i];
            avg = total / studentMarks.length;
            i++;

            if( studentMarks[i] <= 45 ){
                console.log( `Index : ${i} - Fail - ${studentMarks[i]}` );
            }

        }

        console.log( `Total Marks is ${total}` );
        console.log( `Avarage is ${avg}` );
        

    </script>
