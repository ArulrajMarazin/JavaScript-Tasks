<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>

        var shirt = 2500;
        var jeans = 5000;
        var shoes = 7500;

        var totalAcc = shirt + jeans + shoes;
        console.log("Total Accessories :", totalAcc );

        totalAcc += 500;    /* Delivery Charge */
        totalAcc -= 1000;   /* Discount */
        totalAcc += 300;    /* Packaging */

        console.log("Total Price :", totalAcc);

    </script>

</body>

</html>
