<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>

        var mobileData = 20;
        mobileData -= 5;    /* Used data */
        mobileData += 10;   /* Refilled data */
        mobileData -= 8;    /* Again used data */
        mobileData += 5;    /* Again refilled data */
        mobileData -= 3;    /* Again used data */

        console.log("Remaining Data :", mobileData);

    </script>

</body>

</html>
